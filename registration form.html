<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqsa's Coaching Registration</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #6a0dad; /* Purple background */
            color: white; /* White text */
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 500px; /* Maximum width for larger screens */
            margin: auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1); /* Slightly transparent background */
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); /* Shadow effect */
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 100px; /* Adjust logo size */
            margin-bottom: 10px; /* Space below logo */
        }

        h1 {
            font-size: 2.5em;
        }

        h2 {
            font-size: 1.8em;
            margin-top: 20px;
            text-align: center;
        }

        .registration-form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            transition: border 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border: 2px solid #fff; /* White border on focus */
        }

        button {
            background-color: white;
            color: #6a0dad; /* Purple text */
            border: none;
            padding: 12px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #e0e0e0; /* Light gray on hover */
        }

        /* Responsive Styles */
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.5em;
            }

            button {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="Aqsa's Coaching Logo" class="logo">
            <h1>Aqsa's Coaching</h1>
        </header>
        <main>
            <h2>Registration Form</h2>
            <form class="registration-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>
                <div class="form-group">
                    <label for="course">Select Course:</label>
                    <select id="course" name="course" required>
                        <option value="" disabled selected>Select a course</option>
                        <option value="web-development">Web Development</option>
                        <option value="programming-languages">Programming Languages</option>
                        <option value="html-css">HTML and CSS</option>
                        <option value="cooking-classes">Cooking Classes</option>
                    </select>
